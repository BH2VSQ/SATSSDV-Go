name: Test and build native Qt desktop

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Native UI architecture checks
        run: python scripts/check_native_ui.py
      - name: Build backend without native audio
        run: go build -tags "" ./...
      - name: Verify backend RPC lifecycle
        run: python scripts/test_backend_rpc.py

  race-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Race-check modem and codec packages
        run: |
          go test -race ./internal/modem/mary
          go test -race ./internal/image/bcsi
      - name: Race-check RX queue and reconstruction worker
        run: go test -race ./internal/rx
      - name: Race-check filtered QPSK, 8PSK and 16QAM air paths
        run: go test -race ./internal/transport -run '^TestMAModulationTXFilteredRXAirpath$|^TestMAModulationTXFilteredRXWithAudioNoise$'

  qt-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install Qt and audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev libasound2-dev pkg-config
      - name: Configure native Qt application
        run: cmake -S . -B build-qt6 -G Ninja -DCMAKE_BUILD_TYPE=Release -DSATSSDV_WITH_MALGO=ON
      - name: Build native Qt application
        run: cmake --build build-qt6 --parallel 2
      - name: Verify desktop and backend binaries
        run: |
          test -x build-qt6/bin/SATSSDV-Go
          test -x build-qt6/bin/satssdv-backend

  qt-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-pkgconf
      - name: Build native Qt application
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          cmake -S . -B build-qt6 -G Ninja -DCMAKE_BUILD_TYPE=Release -DSATSSDV_WITH_MALGO=ON
          cmake --build build-qt6 --parallel 2
          test -f build-qt6/bin/SATSSDV-Go.exe
          test -f build-qt6/bin/satssdv-backend.exe

  qt-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install Qt
        run: brew install qt
      - name: Build native Qt application
        run: |
          export Qt6_DIR="$(brew --prefix qt)/lib/cmake/Qt6"
          cmake -S . -B build-qt6 -DCMAKE_BUILD_TYPE=Release -DSATSSDV_WITH_MALGO=ON
          cmake --build build-qt6 --parallel 2
          test -d build-qt6/bin/SATSSDV-Go.app
          test -f build-qt6/bin/SATSSDV-Go.app/Contents/MacOS/satssdv-backend
