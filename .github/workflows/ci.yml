name: Test and build native Qt desktop

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aislop-quality-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install C/C++ and Go security analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck clang-format clang-tidy
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install aislop companion tools
        run: npx --yes --package=aislop@0.20.0 aislop-tools
      - name: Configure native compilation database for clang-tidy
        run: |
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build qt6-base-dev libasound2-dev libasound2t64 pkg-config
          cmake -S . -B build-aislop -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSATSSDV_WITH_MALGO=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DGO_EXECUTABLE="$(command -v go)"
          cmake --build build-aislop --parallel 2
      - name: Verify quality toolchain
        run: |
          go version
          cppcheck --version
          clang-format --version
          clang-tidy --version
          govulncheck -version
          npx --yes aislop@0.20.0 doctor
      - name: Run Aislop 0.20.0 and preserve machine-readable output
        id: aislop
        shell: bash
        run: |
          mkdir -p reports/aislop
          set +e
          npm exec --yes --package=aislop@0.20.0 -- aislop ci "$GITHUB_WORKSPACE" \
            > reports/aislop/aislop.json \
            2> reports/aislop/aislop.stderr
          status=$?
          printf '%s\n' "$status" > reports/aislop/aislop.exit
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Generate Aislop Markdown analysis
        if: always()
        env:
          AISLOP_SCAN_OUTCOME: ${{ steps.aislop.outcome }}
          AISLOP_SCAN_EXIT: ${{ steps.aislop.outputs.exit_code }}
        run: |
          python scripts/generate_aislop_report.py \
            --json reports/aislop/aislop.json \
            --output reports/aislop/Aislop-Code-Analysis.md \
            --scan-outcome "$AISLOP_SCAN_OUTCOME" \
            --scan-exit "$AISLOP_SCAN_EXIT"
      - name: Upload Aislop analysis and raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SATSSDV-Go-aislop-code-analysis
          path: reports/aislop/
          if-no-files-found: warn

  qex-itu-channel-regression:
    name: QEX / ITU channel + race regression — ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile:
          - ssdv-ax25
          - ssdv-ccsds-1200
          - ssdv-ccsds-2400
          - pcsi-ccsds-1200
          - pcsi-ccsds-2400
          - ssdv-qpsk-1600
          - ssdv-8psk-1600
          - ssdv-16qam-1600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Prepare per-profile test outputs
        run: mkdir -p reports/channel-csv reports/race
      - name: Run QEX / ITU channel sensitivity sweep through production TX/RX
        env:
          SATSSDV_CHANNEL_TESTS: "1"
          SATSSDV_CHANNEL_PROFILE: ${{ matrix.profile }}
          SATSSDV_CHANNEL_TRIALS: "10"
          SATSSDV_CHANNEL_CSV: ${{ github.workspace }}/reports/${{ matrix.profile }}.csv
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/transport \
            -run '^TestSatelliteChannelSensitivityCharacterization$' \
            2>&1 | tee "reports/channel-${{ matrix.profile }}.log"
      - name: Run race and concurrency regression suite
        if: always() && matrix.profile == 'ssdv-ax25'
        shell: bash
        run: |
          set -o pipefail
          LOG=reports/race/race-regression.log
          run_race() {
            printf '\n$' | tee -a "$LOG"
            printf ' %q' "$@" | tee -a "$LOG"
            printf '\n' | tee -a "$LOG"
            "$@" 2>&1 | tee -a "$LOG"
          }
          run_race go test -race ./internal/modem/mary
          run_race go test -race ./internal/image/bcsi
          run_race go test -race ./internal/rx -run '^TestManagerSubmitRejectsAfterClose$|^TestManagerSubmitDoesNotBlockWhenQueueSaturates$|^TestManagerKeepsIngestingPCSIWhileReconstructionRuns$|^TestManagerDiagnosticsReportsQueueAndProcessingProgress$|^TestGIFManagerDeduplicatesRepeatedControlAndAcceptsRepeatedTX$'
          run_race go test -race ./internal/transport -run '^TestMAModulationTXFilteredRXAirpath$|^TestMAModulationTXFilteredRXWithAudioNoise$'
      - name: Upload profile channel measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SATSSDV-Go-channel-${{ matrix.profile }}
          path: |
            reports/${{ matrix.profile }}.csv
            reports/channel-${{ matrix.profile }}.log
          if-no-files-found: warn
      - name: Upload race regression evidence
        if: always() && matrix.profile == 'ssdv-ax25'
        uses: actions/upload-artifact@v4
        with:
          name: SATSSDV-Go-race-log
          path: reports/race/race-regression.log
          if-no-files-found: warn

  qex-itu-channel-report:
    name: Generate QEX / ITU technical report
    if: always()
    needs: [qex-itu-channel-regression]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download channel measurement artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: SATSSDV-Go-channel-*
          path: reports/channel-csv
          merge-multiple: true
      - name: Download race detector evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: SATSSDV-Go-race-log
          path: reports/race
      - name: Install plotting dependency
        run: python -m pip install --disable-pip-version-check matplotlib
      - name: Generate QEX / ITU Markdown, CSV, JSON and PNG reports
        if: always()
        run: |
          python scripts/generate_qex_report.py \
            --input-dir reports/channel-csv \
            --output-dir reports/qex \
            --trials 10 \
            --race-log reports/race/race-regression.log
      - name: Upload QEX / ITU channel and race report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SATSSDV-Go-QEX-ITU-Channel-Report
          path: |
            reports/qex/
            reports/channel-csv/
            reports/race/
          if-no-files-found: warn

  qt-linux:
    name: Linux — Go tests + Qt build + AppImage/DEB/tar.gz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Go formatting and static contract checks
        run: |
          python scripts/check_gofmt.py
          python scripts/check_native_ui.py
          python scripts/check_qt_startup_contract.py
          python scripts/check_rx_gif_preview.py
          python scripts/check_packaging_contract.py
          python scripts/test_report_generators.py
      - name: Build backend without native audio
        run: go build -tags "" ./...
      - name: Verify backend RPC lifecycle
        run: python scripts/test_backend_rpc.py
      - name: Install Qt and audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev patchelf \
            libasound2-dev libasound2t64 pkg-config
      - name: Verify native build tools
        run: |
          go version
          cmake --version
          pkg-config --modversion alsa
          test -f /usr/lib/$(gcc -dumpmachine)/cmake/Qt6/Qt6Config.cmake || \
            find /usr -path '*/cmake/Qt6/Qt6Config.cmake' -print -quit | grep -q .
      - name: Configure native Qt application
        run: >-
          cmake -S . -B build-qt6 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSATSSDV_WITH_MALGO=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DGO_EXECUTABLE="$(command -v go)"
      - name: Build native Qt application
        run: cmake --build build-qt6 --parallel 2 --verbose
      - name: Verify desktop and backend binaries
        run: |
          test -x build-qt6/bin/SATSSDV-Go
          test -x build-qt6/bin/satssdv-backend
          ! ldd build-qt6/bin/SATSSDV-Go | grep -q 'not found'
          ! ldd build-qt6/bin/satssdv-backend | grep -q 'not found'
      - name: Stage Linux build and tarball
        run: |
          cmake --install build-qt6 --prefix dist
          tar -czf SATSSDV-Go-linux-x86_64.tar.gz -C dist .
      - name: Build Debian package
        run: |
          mkdir -p package-deb
          cpack --config build-qt6/CPackConfig.cmake -G DEB -B package-deb
          DEB_FILE="$(find package-deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB_FILE"
          cp "$DEB_FILE" SATSSDV-Go-linux-x86_64.deb
      - name: Build AppImage
        run: |
          TOOL_DIR="$RUNNER_TEMP/linuxdeploy-tools"
          mkdir -p "$TOOL_DIR" AppDir/usr
          cp -a dist/. AppDir/usr/
          cp packaging/linux/satssdv-go.desktop AppDir/satssdv-go.desktop
          cp packaging/linux/satssdv-go.svg AppDir/satssdv-go.svg
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output "$TOOL_DIR/linuxdeploy-x86_64.AppImage"
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            --output "$TOOL_DIR/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x "$TOOL_DIR"/*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(command -v qmake6)"
          test -x "$QMAKE"
          "$TOOL_DIR/linuxdeploy-x86_64.AppImage" \
            --appdir AppDir \
            --executable AppDir/usr/bin/SATSSDV-Go \
            --executable AppDir/usr/bin/satssdv-backend \
            --desktop-file AppDir/satssdv-go.desktop \
            --icon-file AppDir/satssdv-go.svg \
            --plugin qt \
            --output appimage
          APPIMAGE_FILE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE_FILE"
          mv "$APPIMAGE_FILE" SATSSDV-Go-linux-x86_64.AppImage
      - name: Generate Linux artifact checksums
        run: sha256sum SATSSDV-Go-linux-x86_64.tar.gz SATSSDV-Go-linux-x86_64.deb SATSSDV-Go-linux-x86_64.AppImage > SATSSDV-Go-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SATSSDV-Go-linux-x86_64
          path: |
            SATSSDV-Go-linux-x86_64.tar.gz
            SATSSDV-Go-linux-x86_64.deb
            SATSSDV-Go-linux-x86_64.AppImage
            SATSSDV-Go-linux-x86_64.sha256
          if-no-files-found: error

  qt-windows:
    name: Windows — Go tests + Qt build + installer/portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: setup-go
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Go formatting and static contract checks
        run: |
          python scripts/check_gofmt.py
          python scripts/check_native_ui.py
          python scripts/check_qt_startup_contract.py
          python scripts/check_rx_gif_preview.py
          python scripts/check_packaging_contract.py
          python scripts/test_report_generators.py
      - name: Build backend without native audio
        run: go build -tags "" ./...
      - name: Verify backend RPC lifecycle
        run: python scripts/test_backend_rpc.py
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-pkgconf
      # setup-go modifies the Windows PATH. Do not rely on that PATH being
      # translated by MSYS2: pass the absolute go.exe path to CMake explicitly.
      - name: Resolve Go executable for MSYS2/CMake
        shell: pwsh
        run: |
          $goExe = (Get-Command go.exe -ErrorAction Stop).Source
          if (-not (Test-Path -LiteralPath $goExe)) {
            throw "setup-go returned a missing executable: $goExe"
          }
          $goExe = $goExe -replace '\\', '/'
          Add-Content -Path $env:GITHUB_ENV -Value "GO_EXECUTABLE=$goExe"
          & $goExe version
      - name: Build native Qt application
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          if [[ -z "${GO_EXECUTABLE:-}" ]]; then
            echo "GO_EXECUTABLE was not exported by the PowerShell setup-go step" >&2
            exit 1
          fi
          GO_UNIX_PATH="$(cygpath -u "$GO_EXECUTABLE")"
          if [[ ! -x "$GO_UNIX_PATH" ]]; then
            echo "Go executable is not accessible from MSYS2: $GO_EXECUTABLE" >&2
            exit 1
          fi
          "$GO_UNIX_PATH" version
          cmake -S . -B build-qt6 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSATSSDV_WITH_MALGO=ON \
            -DGO_EXECUTABLE="$GO_EXECUTABLE"
          cmake --build build-qt6 --parallel 2 --verbose
          test -f build-qt6/bin/SATSSDV-Go.exe
          test -f build-qt6/bin/satssdv-backend.exe
          test -f build-qt6/bin/Qt6Core.dll
          test -f build-qt6/bin/Qt6Widgets.dll
          # Both PE images must use the GUI subsystem; no console window may appear.
          objdump -p build-qt6/bin/SATSSDV-Go.exe | grep -E 'Subsystem.*Windows GUI'
          objdump -p build-qt6/bin/satssdv-backend.exe | grep -E 'Subsystem.*Windows GUI'
      - name: Bundle transitive MinGW DLL dependencies
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          python scripts/deploy_windows_dlls.py \
            --package-dir "$(cygpath -w build-qt6/bin)" \
            --mingw-bin "$(cygpath -w /mingw64/bin)" \
            --objdump "$(cygpath -w /mingw64/bin/objdump.exe)"
      - name: Stage Windows portable distribution
        shell: pwsh
        run: |
          $portable = Join-Path $env:GITHUB_WORKSPACE "dist/windows/portable"
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item -Path "build-qt6/bin/*" -Destination $portable -Recurse -Force
          if (-not (Test-Path (Join-Path $portable "SATSSDV-Go.exe"))) {
            throw "Portable package is missing SATSSDV-Go.exe"
          }
          if (-not (Test-Path (Join-Path $portable "satssdv-backend.exe"))) {
            throw "Portable package is missing satssdv-backend.exe"
          }
          Copy-Item "packaging/windows/PORTABLE-README.txt" -Destination $portable
          $portableZip = Join-Path $env:GITHUB_WORKSPACE "SATSSDV-Go-windows-x86_64-portable.zip"
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath $portableZip -CompressionLevel Optimal -Force
          if ((Get-Item $portableZip).Length -le 0) { throw "Portable ZIP is empty" }
      - name: Build Windows installer with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $programFilesX86 "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $sourceDir = (Resolve-Path "dist/windows/portable").Path
          & $iscc "/DSourceDir=$sourceDir" "packaging/windows/SATSSDV-Go.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with code $LASTEXITCODE" }
          $installer = "dist/windows/SATSSDV-Go-Setup-0.16.0.exe"
          if (-not (Test-Path $installer)) { throw "Installer output missing: $installer" }
          Copy-Item $installer "SATSSDV-Go-windows-x86_64-Setup.exe" -Force
      - name: Verify Windows portable and installer outputs
        shell: pwsh
        run: |
          Get-Item "SATSSDV-Go-windows-x86_64-portable.zip", "SATSSDV-Go-windows-x86_64-Setup.exe" |
            Format-Table Name, Length
          if ((Get-Item "SATSSDV-Go-windows-x86_64-portable.zip").Length -le 0) { throw "Portable ZIP is empty" }
          if ((Get-Item "SATSSDV-Go-windows-x86_64-Setup.exe").Length -le 0) { throw "Installer is empty" }
      - uses: actions/upload-artifact@v4
        with:
          name: SATSSDV-Go-windows-x86_64
          path: |
            SATSSDV-Go-windows-x86_64-portable.zip
            SATSSDV-Go-windows-x86_64-Setup.exe
          if-no-files-found: error

  qt-macos:
    name: macOS ${{ matrix.arch }} — Go tests + Qt build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            uname_arch: arm64
            cmake_arch: arm64
          - runner: macos-26-intel
            arch: amd64
            uname_arch: x86_64
            cmake_arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      GOOS: darwin
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Go formatting and static contract checks
        run: |
          python scripts/check_gofmt.py
          python scripts/check_native_ui.py
          python scripts/check_qt_startup_contract.py
          python scripts/check_rx_gif_preview.py
          python scripts/check_packaging_contract.py
          python scripts/test_report_generators.py
      - name: Build backend without native audio
        run: go build -tags "" ./...
      - name: Verify backend RPC lifecycle
        run: python scripts/test_backend_rpc.py
      - name: Verify native runner architecture
        run: |
          echo "Runner: $(uname -m)"
          echo "Go target: $(go env GOOS)/$(go env GOARCH)"
          test "$(uname -m)" = "${{ matrix.uname_arch }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - name: Install Qt
        run: brew install qtbase pkg-config
      - name: Configure native Qt application
        run: |
          QT_PREFIX="$(brew --prefix qtbase)"
          HOMEBREW_PREFIX="$(brew --prefix)"
          cmake -S . -B build-qt6 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DQt6_DIR="$QT_PREFIX/lib/cmake/Qt6" \
            -DSATSSDV_WITH_MALGO=ON \
            -DSATSSDV_HOMEBREW_PREFIX="$HOMEBREW_PREFIX" \
            -DGO_EXECUTABLE="$(command -v go)"
      - name: Build native Qt application
        run: cmake --build build-qt6 --parallel 2 --verbose
      - name: Verify app bundle and backend architecture
        run: |
          APP="build-qt6/bin/SATSSDV-Go.app"
          test -d "$APP"
          BACKEND="$APP/Contents/MacOS/satssdv-backend"
          test -x "$BACKEND"
          file "$BACKEND"
          lipo "$BACKEND" -verify_arch "${{ matrix.cmake_arch }}"
          lipo "$APP/Contents/MacOS/SATSSDV-Go" -verify_arch "${{ matrix.cmake_arch }}"
          codesign --verify --deep --strict "$APP"
      - name: Archive macOS app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build-qt6/bin/SATSSDV-Go.app \
            "SATSSDV-Go-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SATSSDV-Go-macos-${{ matrix.arch }}
          path: SATSSDV-Go-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
