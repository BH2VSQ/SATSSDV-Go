name: Go CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Frontend syntax
        run: node --check frontend/app.js
      - name: Frontend structure
        run: node frontend/ui_structure.test.cjs
